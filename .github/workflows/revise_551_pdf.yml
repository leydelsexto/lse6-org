name: Publish corrected LSE6 551-page PDF
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/revise_551_pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-revised-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF editor
        run: python -m pip install PyMuPDF==1.26.7
      - name: Revise PDF in place and update public manifest
        run: python tools/revise_551_pdf.py
      - name: Update integrity inventory
        run: python tools/sitemap_inventory.py
      - name: Publish verified PDF and hashes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/lse6-expediente-completo.pdf evidence/index.json INTEGRITY.sha256 sitemap.xml image-sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish LSE6 551-page PDF editorial revision with verified hashes"
            git push
          fi
