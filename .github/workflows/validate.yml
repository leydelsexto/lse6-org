name: Validate LSE6 archive surface

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lse6-archive-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-validation.txt
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: python -m pip install -r tools/requirements-validation.txt
      - name: Install pinned Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Build exhaustive public sitemap inventory
        run: python tools/sitemap_inventory.py
      - name: Validate release contract without legacy sitemap limit
        run: python tools/validate_release_compat.py
      - name: Validate mobile media contract
        run: python tools/validate_mobile_media.py
      - name: Validate center navigation in Chromium
        run: python tools/test_center_navigation.py
      - name: Validate IndexNow notification logic
        run: python -m unittest tools/test_submit_indexnow.py
      - name: Rebuild offline and restore exhaustive sitemaps
        run: |
          python tools/rebuild_release.py
          python tools/sitemap_inventory.py
          python tools/sitemap_inventory.py --check
      - name: Refuse unexpected generated drift
        shell: bash
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(sitemap.xml|image-sitemap.xml|INTEGRITY.sha256)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected deterministic drift:"
            echo "$unexpected"
            exit 1
          fi
      - name: Persist generated public inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if ! git diff --quiet -- sitemap.xml image-sitemap.xml INTEGRITY.sha256; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml image-sitemap.xml INTEGRITY.sha256
            git commit -m "Regenerate exhaustive LSE6.org sitemap inventory"
            git push
          fi

  notify-indexnow:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit complete public sitemap inventory to IndexNow
        run: python tools/submit_indexnow.py --all
